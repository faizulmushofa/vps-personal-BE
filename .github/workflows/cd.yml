name: Continuous Deployment (CD) with Tailscale & GHCR

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - dev

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    # Hanya jalankan jika pull request berhasil di-merge (bukan di-close tanpa merge)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Make Maven Wrapper Executable
      run: chmod +x mvnw

    - name: Build and Package JAR
      run: ./mvnw clean package -DskipTests

    - name: Convert Repository Name to Lowercase for Docker
      run: |
        echo "REPO_NAME=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        platforms: linux/amd64
        push: true
        tags: |
          ghcr.io/${{ env.REPO_NAME }}:latest
          ghcr.io/${{ env.REPO_NAME }}:${{ github.sha }}

    - name: Connect to Tailscale Network
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

    - name: Copy docker-compose.yml to VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: debian.tail8c6155.ts.net
        username: horizon
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        source: "docker-compose.yml"
        target: "/home/horizon/vps-personal-backend/"

    - name: Deploy to VPS via SSH over Tailscale
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: debian.tail8c6155.ts.net
        username: horizon
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          # 1. Pindah ke direktori proyek backend di VPS
          cd /home/horizon/vps-personal-backend

          # 2. Login ke GHCR di dalam VPS untuk mengunduh image privat
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          # 3. Download image versi terbaru
          docker compose pull

          # 4. Terapkan container baru secara background (restart)
          docker compose up -d

          # 5. Logout dari GHCR demi keamanan di server
          docker logout ghcr.io
