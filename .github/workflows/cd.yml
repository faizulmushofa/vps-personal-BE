name: CI/CD Pipeline - Tailscale & GHCR

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Continuous Integration (Build & Push)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Make Maven Wrapper Executable
      run: chmod +x mvnw

    - name: Build and Package JAR
      run: ./mvnw clean package -DskipTests

    - name: Convert Repository Name to Lowercase for Docker
      run: |
        echo "REPO_NAME=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        platforms: linux/amd64
        push: true
        tags: |
          ghcr.io/faizulmushofa/vps-personal-be:latest
          ghcr.io/faizulmushofa/vps-personal-be:${{ github.sha }}

  cd:
    name: Continuous Deployment (VPS Deploy)
    runs-on: ubuntu-latest
    needs: ci
    # Hanya jalankan deploy jika push/merge terjadi langsung di branch main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Connect to Tailscale Network
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

    - name: Copy docker-compose.yml to VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: horizon
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        source: "docker-compose.yml"
        target: "/home/horizon/vps-personal-backend/"

    - name: Deploy to VPS via SSH over Tailscale
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: horizon
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          cd /home/horizon/vps-personal-backend
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker compose pull
          docker compose up -d
          docker logout ghcr.io

    - name: Verify Deployment Health (Health Check)
      run: |
        echo "Menjalankan Health Check ke backend di port 8090..."
        SUCCESS=false
        for i in {1..12}; do
          # Lakukan request ke VPS Host (IP Tailscale) di port 8090
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.VPS_HOST }}:8090/ || echo "000")
          if [ "$STATUS" != "000" ]; then
            echo "Health Check SUKSES! Backend merespon dengan HTTP status: $STATUS"
            SUCCESS=true
            break
          fi
          echo "Menunggu backend menyala... Percobaan $i/12 (Tidur 5 detik)"
          sleep 5
        done
        if [ "$SUCCESS" = false ]; then
          echo "Health Check GAGAL! Backend tidak merespon dalam waktu 60 detik."
          exit 1
        fi
