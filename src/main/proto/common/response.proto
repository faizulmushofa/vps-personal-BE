syntax = "proto3";

package common;

option java_multiple_files = true;
option java_package = "io.github.storagenode.grpc.common";

message FinalizeRequest {
  string file_id = 1;
  int32 total_chunks = 2;
}

message UploadBatchResponse {
  string file_id = 1;
  bool success = 2;
  string message = 3;
}

message FinalizeResponse {
  string file_id = 1;
  bool success = 2;
  string message = 3;
}
