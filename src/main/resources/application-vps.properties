# Spring Boot optimization for 1GB VPS deployment

# === Server (Tomcat) ===
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=2
server.tomcat.accept-count=5
server.tomcat.max-connections=100
server.compression.enabled=true
server.compression.min-response-size=1024

# === Spring WebFlux ===
spring.webflux.base-path=/api
spring.codec.max-in-memory-size=1MB

# === Reactive Database (R2DBC) ===
spring.r2dbc.pool.initial-size=2
spring.r2dbc.pool.max-size=5
spring.r2dbc.pool.max-acquire-time=2s
spring.r2dbc.pool.max-idle-time=10m
spring.r2dbc.pool.validation-query=SELECT 1

# === gRPC Server (if embedded) ===
grpc.server.enable-keep-alive=true
grpc.server.keep-alive-time=30s
grpc.server.keep-alive-timeout=5s
grpc.server.permit-keep-alive-without-calls=false
grpc.server.max-concurrent-streams=50

# === gRPC Client (for storage node) ===
grpc.client.GLOBAL.negotiation-type=plaintext
grpc.client.GLOBAL.keep-alive-time=30s
grpc.client.GLOBAL.keep-alive-timeout=5s

# === Actuator (minimal) ===
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# === Logging (reduce verbosity) ===
logging.level.root=WARN
logging.level.io.github.faizul=INFO
logging.level.org.springframework.boot=WARN
logging.level.org.springframework.web=WARN
logging.level.io.grpc=WARN
logging.level.io.r2dbc=WARN

# === File Upload Configuration ===
# Chunk size: 5MB (balance between memory and upload speed)
upload.chunk-size=5242880
# Max concurrent uploads: 2 (on 1GB VPS, limit concurrent file operations)
upload.max-concurrent=2
# Temp directory: use app-specific dir (avoid /tmp filling up system)
upload.temp-dir=/app/temp

# === PDF Processing ===
# Single-threaded PDF extraction (PDFBox is CPU-bound, not I/O-bound)
pdf.processor-threads=1
# Timeout: 60s (PDFBox can be slow on limited CPU)
pdf.extraction-timeout=60s

# === AI Integration (Gemini) ===
# Request timeout for Gemini
spring.ai.timeout=30s
# Queue size: keep queue small to avoid memory buildup
spring.ai.retry-attempts=1

# === Connection Timeouts ===
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# === Performance ===
spring.jmx.enabled=false
spring.devtools.restart.enabled=false
spring.h2.console.enabled=false
