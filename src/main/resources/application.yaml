spring:
  application:
    name: vps-personal-backend
  r2dbc:
    url: ${DATABASE_URL}
  sql:
    init:
      mode: always
  grpc:
    security:
      service-token: ${SERVICE_TOKEN}
    client:
      channels:
        storage-node:
          address: ${STORAGE_NODE_URL}
          negotiation-type: ${GRPC_CLIENT_NEGOTIATION_TYPE:tls}
          secure: ${GRPC_CLIENT_SECURE:true}
          ssl:
            bundle: trust-all-bundle
  ai:
    openai:
      api-key: ${OPEN_ROUTER_API_KEY}
      base-url: https://openrouter.ai/api/v1
    google:
      genai:
        api-key: ${GEMINI_API_KEY}

google:
  client-id: ${GOOGLE_GLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}

brevo:
  api-key: ${BREVO_API_KEY}
  sender:
    email: ${BREVO_SENDER_EMAIL}
    name: ${BREVO_SENDER_NAME:Premium VPS Cloud}

jwt:
  access-token-expiry-hours: 1

server:
  port: 8090

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha

app:
  frontend-url: ${FRONTEND_URL}

llamaparse:
  api-key: ${LLAMA_CLOUD_API_KEY:}
  enabled: ${LLAMAPARSE_ENABLED:true}
  tier: ${LLAMAPARSE_TIER:fast}
  custom-prompt: ${LLAMAPARSE_CUSTOM_PROMPT:Ekstrak semua teks secara verbatim (kata per kata), pertahankan urutan dan format aslinya. Jangan merangkum, menjelaskan, atau menafsirkan teks; berikan transkripsi literal.}

midtrans:
  server-key: ${MIDTRANS_SERVER_KEY:}
  client-key: ${MIDTRANS_CLIENT_KEY:}
  snap-url: ${MIDTRANS_SNAP_URL:https://app.sandbox.midtrans.com/snap/v1}
  api-url: ${MIDTRANS_API_URL:https://api.sandbox.midtrans.com}