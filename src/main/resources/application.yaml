spring:
  application:
    name: vps-personal-backend
  r2dbc:
    url: ${DATABASE_URL}
  sql:
    init:
      mode: always
  grpc:
    security:
      service-token: ${SERVICE_TOKEN}
    client:
      channels:
        storage-node:
          address: ${STORAGE_NODE_URL}
          negotiation-type: tls
          secure: false

google:
  client-id: ${GOOGLE_GLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}

gemini:
  api-key: ${GEMINI_API_KEY}

brevo:
  api-key: ${BREVO_API_KEY}
  sender:
    email: ${BREVO_SENDER_EMAIL}
    name: ${BREVO_SENDER_NAME:Premium VPS Cloud}

jwt:
  access-token-expiry-hours: 1

server:
  port: 8090

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}