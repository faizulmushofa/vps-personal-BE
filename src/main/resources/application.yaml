spring:
  application:
    name: vps-personal-backend
  r2dbc:
    url: ${DATABASE_URL}
  sql:
    init:
      mode: always

  grpc:
    client:
      channels:
        storage-node:
          address: static://${STORAGE_NODE_URL}
          negotiation-type: tls

jwt:
  access-token-expiry-hours: 24